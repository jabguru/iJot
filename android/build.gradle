allprojects {
    repositories {
        google()
        jcenter()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
subprojects {
    project.configurations.all {
        resolutionStrategy {
            // Force androidx.datastore to 1.1.7 because 1.2.0 ships
            // libdatastore_shared_counter.so that is not 16KB page-size aligned
            force 'androidx.datastore:datastore:1.1.7'
            force 'androidx.datastore:datastore-android:1.1.7'
            force 'androidx.datastore:datastore-core:1.1.7'
            force 'androidx.datastore:datastore-core-android:1.1.7'
            force 'androidx.datastore:datastore-preferences:1.1.7'
            force 'androidx.datastore:datastore-preferences-android:1.1.7'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

gradle.projectsEvaluated {
    subprojects { subproject ->
        if (subproject.plugins.hasPlugin("com.android.library") || subproject.plugins.hasPlugin("com.android.application")) {
            subproject.tasks.withType(JavaCompile).configureEach {
                // Remove -Werror so warnings don’t fail the build
                it.options.compilerArgs.removeAll { arg -> arg == "-Werror" }
            }
        }
    }
}


